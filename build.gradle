plugins {
    id 'com.android.application' version '9.0.1'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mapkitApiKey = localProperties.getProperty('MAPKIT_API_KEY', '')
        .replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace = 'ru.gpsantiradar.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'ru.gpsantiradar.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 39
        versionName = '4.9.4'
        buildConfigField 'String', 'MAPKIT_API_KEY', "\"${mapkitApiKey}\""
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        projectDebug {
            storeFile = rootProject.file('work/gps-antiradar-debug.keystore')
            storePassword = 'android'
            keyAlias = 'gpsantiradar'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.projectDebug
        }
        release {
            signingConfig = signingConfigs.projectDebug
            minifyEnabled = false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

base {
    archivesName = 'GPS-AntiRadar'
}

dependencies {
    implementation 'com.yandex.android:maps.mobile:4.42.0-lite'
    implementation 'com.google.code.gson:gson:2.11.0'
}
